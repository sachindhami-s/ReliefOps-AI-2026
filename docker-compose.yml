# =============================================================================
# ReliefOps AI — Docker Compose Orchestration
# Course: CSE476 — Agentic AI and Intelligent Automation
# =============================================================================

services:
  reliefops-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reliefops-ai-service
    user: "1000:1000"
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - RELIEFOPS_EXECUTION_MODE=${RELIEFOPS_EXECUTION_MODE:-deterministic}
      - RELIEFOPS_LOG_LEVEL=${RELIEFOPS_LOG_LEVEL:-INFO}
      - DATABASE_PATH=data/reliefops.db
      - CHROMADB_PATH=data/chromadb
      - SOP_DIR=data/sops
      - GINI_THRESHOLD=${GINI_THRESHOLD:-0.35}
      - SURVIVAL_FLOOR_RATIO=${SURVIVAL_FLOOR_RATIO:-0.30}
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
    volumes:
      # Mount entire data directory so SQLite WAL/SHM files, ChromaDB, and SOPs persist together
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
